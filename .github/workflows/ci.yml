name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # Core solution (service, CLI, sync engine) builds and tests anywhere.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build TmSync.sln -c Release
      - name: Test
        run: dotnet test TmSync.sln -c Release --no-build --verbosity normal

  # The WPF GUI requires Windows to build; also produces ready-to-run binaries.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build GUI (WPF)
        run: dotnet build src/TmSync.Manager -c Release
      - name: Publish win-x64 binaries
        run: |
          dotnet publish src/TmSync.Service -c Release -r win-x64 --self-contained -o publish/TmSync
          dotnet publish src/TmSync.Cli -c Release -r win-x64 --self-contained -o publish/TmSync
          dotnet publish src/TmSync.Manager -c Release -r win-x64 --self-contained -o publish/TmSync
      - uses: actions/upload-artifact@v4
        with:
          name: TmSync-win-x64
          path: publish/TmSync
